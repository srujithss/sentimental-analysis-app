<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Speech bubble -->
  <rect x="2" y="3" width="28" height="20" rx="4" fill="#2563eb"/>
  <polygon points="8,23 14,23 10,29" fill="#2563eb"/>
  <!-- Sentiment bars: negative (short), neutral (medium), positive (tall) -->
