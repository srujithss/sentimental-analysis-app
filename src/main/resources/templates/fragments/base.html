<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${title}">Sentiment</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<nav th:fragment="userNav" class="nav nav-user">
    <a class="brand" th:href="@{/user/dashboard}"><span class="brand-mark"></span>Sentiment</a>
    <div class="nav-links">
        <a th:href="@{/user/dashboard}">Dashboard</a>
        <a th:href="@{/user/analyze}">Analyze</a>
        <a th:href="@{/user/history}">History</a>
    </div>
    <div th:replace="~{fragments/base :: userMenu}"></div>
</nav>

<nav th:fragment="adminNav" class="nav nav-admin">
    <a class="brand" th:href="@{/admin/dashboard}"><span class="brand-mark"></span>Sentiment <span class="brand-tag">Admin</span></a>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Overview</a>
    </div>
    <div th:replace="~{fragments/base :: userMenu}"></div>
</nav>

<div th:fragment="userMenu" class="user-menu">
    <button type="button" class="avatar-btn" aria-haspopup="true" aria-expanded="false" title="Account">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
    </button>
    <div class="user-pop hidden" role="menu">
        <div class="user-info">
            <span class="user-label">Signed in as</span>
            <strong class="user-name" sec:authentication="name">user</strong>
        </div>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="icon-btn" title="Logout" aria-label="Logout">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
                </svg>
            </button>
        </form>
    </div>
</div>

</body>
</html>
